<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        h2 { color: #6366f1; }
        .btn { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: 8px 4px; }
        .btn:hover { background: #4f46e5; }
        canvas { display: none; }
        .links a { display: block; margin: 4px 0; color: #6366f1; }
        .status { margin-top: 16px; padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; color: #15803d; }
    </style>
</head>
<body>
    <h2>🏢 Enterprise Portal — PWA Icon Generator</h2>
    <p>Click the button below to generate all PWA icon sizes and download them.</p>
    <button class="btn" onclick="generateAll()">⬇️ Generate & Download All Icons</button>
    <canvas id="canvas"></canvas>
    <div id="links" class="links"></div>
    <div id="status"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

        function drawIcon(ctx, size) {
            // Gradient background
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#6366f1');
            grad.addColorStop(1, '#8b5cf6');

            // Rounded rect
            const r = size * 0.15;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Building emoji
            ctx.font = `${size * 0.55}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏢', size / 2, size / 2 + size * 0.04);
        }

        function generateAll() {
            const canvas = document.getElementById('canvas');
            const linksDiv = document.getElementById('links');
            const status = document.getElementById('status');
            linksDiv.innerHTML = '<strong>Click each link to download:</strong><br>';

            sizes.forEach(size => {
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size, size);
                drawIcon(ctx, size);

                const dataUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `icon-${size}x${size}.png`;
                a.textContent = `📥 icon-${size}x${size}.png`;
                linksDiv.appendChild(a);
                linksDiv.appendChild(document.createElement('br'));

                // Auto-trigger download
                setTimeout(() => a.click(), sizes.indexOf(size) * 300);
            });

            status.innerHTML = '✅ All icons generated! Save them to <code>wwwroot/icons/</code>';
        }
    </script>
</body>
</html>
