<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Generate PWA Icons</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f8fafc; }
        h2 { color: #6366f1; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 20px; }
        button { background: #6366f1; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #4f46e5; }
        #log { margin-top: 20px; font-size: 0.9rem; color: #334155; }
        #log div { padding: 4px 0; }
        .ok { color: #16a34a; }
        .info { color: #0369a1; }
    </style>
</head>
<body>
    <h2>🏢 Enterprise Portal — PWA Icon Generator</h2>
    <p>
        Open this file in your browser.<br>
        Click the button — all icons will download automatically.<br>
        Save them to <code>wwwroot/icons/</code> folder.
    </p>
    <button onclick="generateAll()">⬇️ Generate &amp; Download All Icons</button>
    <div id="log"></div>
    <canvas id="c" style="display:none"></canvas>

<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const log = document.getElementById('log');

function addLog(msg, cls) {
    const d = document.createElement('div');
    d.className = cls || '';
    d.innerHTML = msg;
    log.appendChild(d);
}

function drawIcon(canvas, size) {
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Rounded rect gradient background
    const r = size * 0.18;
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#6366f1');
    grad.addColorStop(1, '#8b5cf6');

    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.arcTo(size, 0, size, r, r);
    ctx.lineTo(size, size - r);
    ctx.arcTo(size, size, size - r, size, r);
    ctx.lineTo(r, size);
    ctx.arcTo(0, size, 0, size - r, r);
    ctx.lineTo(0, r);
    ctx.arcTo(0, 0, r, 0, r);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // White "E" letter (Enterprise)
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = `bold ${size * 0.52}px "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('E', size / 2, size / 2 + size * 0.03);

    // Small dot accent
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(size * 0.72, size * 0.28, size * 0.06, 0, Math.PI * 2);
    ctx.fill();
}

function generateAll() {
    log.innerHTML = '';
    addLog('<div class="info">⏳ Generating icons...</div>');
    const canvas = document.getElementById('c');

    sizes.forEach((size, i) => {
        setTimeout(() => {
            drawIcon(canvas, size);
            const dataUrl = canvas.toDataURL('image/png');
            const filename = `icon-${size}x${size}.png`;

            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            addLog(`<span class="ok">✅ Downloaded: ${filename}</span>`);

            if (i === sizes.length - 1) {
                addLog('<br><strong>All done! Now copy these PNG files to <code>FirstBlazorApp/wwwroot/icons/</code></strong>');
            }
        }, i * 400);
    });
}
</script>
</body>
</html>
