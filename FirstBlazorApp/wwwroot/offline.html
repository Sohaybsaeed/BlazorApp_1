<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Enterprise Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 400px;
        }
        .icon { font-size: 5rem; margin-bottom: 24px; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 1rem; opacity: 0.85; margin-bottom: 32px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: #fff;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            No internet connection detected.<br />
            Please check your network and try again.
        </p>
        <button class="btn" onclick="window.location.reload()">🔄 Try Again</button>
    </div>
</body>
</html>
